services:
  - type: web
    name: router4-x2dfd-demo
    runtime: python
    plan: free
    buildCommand: npm --prefix web/frontend install && npm --prefix web/frontend run build && pip install -r web/backend/requirements.txt
    startCommand: python -m uvicorn web.backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RUN_MODE
        value: mock
      - key: PYTHON_VERSION
        value: 3.11.9
