    - image_path: /home/aiotlab/hoangan/datasets/CROSSDATA_FINAL_EVAL/Celeb-DF-v2/Celeb-synthesis/frames/id1_id0_0007/000.png
    - image_path: /home/aiotlab/hoangan/datasets/CROSSDATA_FINAL_EVAL/Celeb-DF-v2/Celeb-synthesis/frames/id1_id0_0007/010.png
    - image_path: /home/aiotlab/hoangan/datasets/CROSSDATA_FINAL_EVAL/DFDCP/method_A/frames/1848521_1152039_A_000/000.png
    - image_path: /home/aiotlab/hoangan/datasets/CROSSDATA_FINAL_EVAL/DFDCP/method_A/frames/1848521_1152039_A_000/014.png
