paths:
  results_dir: eval/outputs
weak_supplies:
- provider: blending
  alias: Blending
  model_name: swinv2_base_window16_256
  weights_path: weights/blending_models/best_gf.pth
  img_size: 256
  num_class: 2
  batch_size: 128
  num_workers: 8
  pin_memory: true
  thresholds:
    lo: 0.3
    hi: 0.7
- provider: diffusion_detector
  alias: Diffusion
  weights_dir: weights/
  model: ours-sync
  batch_size: 32
  num_workers: 8
  pin_memory: true
  thresholds:
    lo: 0.3
    hi: 0.7
model:
  base: weights/base/llava-v1.5-7b
  adapter: weights/checkpoints/ckpt/llava-v1.5-7b-lora-[ble-diff]
